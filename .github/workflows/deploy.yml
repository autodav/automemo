name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test backend push (unitari, senza dipendenze)
        run: node --test worker/test/*.test.ts
      - run: npm run build
        env:
          BASE_PATH: /automemo/
          # URL del backend push (Cloudflare Worker). Vuoto = notifiche push disattivate.
          # Si imposta in GitHub: Settings → Secrets and variables → Actions → Variables → PUSH_API_URL
          VITE_PUSH_API_URL: ${{ vars.PUSH_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
